[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-grouping-adapter"
version = "0.1.0"
description = "Inspectable individual/shared evidence adapters for frozen vision encoders"
requires-python = ">=3.9"
dependencies = ["torch>=2.6,<3", "torchvision>=0.21,<0.24", "timm==1.0.22", "numpy>=1.26,<3", "Pillow>=10,<12"]

[project.optional-dependencies]
baseline = ["einops==0.8.1", "easydict==1.13"]

[tool.setuptools.packages.find]
where = ["src"]
